plugins:
  open-terminal:
    shortCut: Ctrl-T
    confirm: false
    description: Open a terminal in the current context
    scopes:
      - all
    command: zsh
    background: false
    args:
      - -c
      - |-
        kubectl config use-context "$CONTEXT" && printf '\e[1;30;42m k9s zsh terminal. Ctrl-D or exit to go back to k9s \e[0m\n' && exec zsh
